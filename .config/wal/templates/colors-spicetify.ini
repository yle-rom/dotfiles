; generated by pywal from ~/.config/wal/templates/colors-spicetify.ini
; symlinked as ~/.config/spicetify/Themes/marketplace/color.ini
; switch scheme: spicetify config color_scheme <Spotify|pywal> && spicetify apply

[pywal]
accent             = {color3.strip}
accent-active      = {color2.strip}
accent-inactive    = {color8.strip}
banner             = {color3.strip}
border-active      = {color3.strip}
border-inactive    = {color8.strip}
button             = {color3.strip}
button-active      = {color3.strip}
button-disabled    = {color8.strip}
card               = {color8.strip}
header             = {color15.strip}
highlight          = {color8.strip}
highlight-elevated = {color8.strip}
main               = {color0.strip}
main-elevated      = {color0.strip}
notification       = {color6.strip}
notification-error = {color1.strip}
player             = {color0.strip}
selected-row       = {color8.strip}
shadow             = {color0.strip}
sidebar            = {color0.strip}
subtext            = {color8.strip}
tab-active         = {color8.strip}
text               = {foreground.strip}

; the original static scheme (before pywal), kept for switching back
[Spotify]
accent             = D08B57
accent-active      = BFAA80
accent-inactive    = A0907A
banner             = D08B57
border-active      = D08B57
border-inactive    = A0907A
header             = DDD5C4
highlight          = 3A372F
main               = 2C2A24
notification       = 7699A3
notification-error = B05A5A
subtext            = A0907A
text               = DDD5C4
