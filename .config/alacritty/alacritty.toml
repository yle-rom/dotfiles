[general]
import = ["~/.config/alacritty/colors-active.toml"]

[window]
padding = { x = 0, y = 0 }
dynamic_title = true
opacity = 0.8
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font"}
size = 10


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"
