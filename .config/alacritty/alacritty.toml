[general]
import = ["~/.config/alacritty/colors-active.toml"]

[window]
padding = { x = 0, y = 0 }
dynamic_title = true
opacity = 0.7
blur = true

[font]
normal = { family = "ShureTechMono Nerd Font"}
size = 11
offset = { x = 0, y = 2 }

[colors]
# ShureTechMono has no bold face, so show bold as the bright color instead
draw_bold_text_with_bright_colors = true

[mouse]
hide_when_typing = true

# Hints: a defined list replaces Alacritty's defaults, so the URL opener is re-declared here
[[hints.enabled]]
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^⟨⟩`\\]+'
hyperlinks = true
post_processing = true
command = "xdg-open"
binding = { key = "U", mods = "Alt" }
mouse = { enabled = true, mods = "Control" }

# Copy IPv4 (with optional /cidr or :port), hex hashes (32-128 chars) or URLs
[[hints.enabled]]
regex = '(?-u:\b)(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2}|:\d{1,5})?(?-u:\b)|(?-u:\b)[0-9a-fA-F]{32,128}(?-u:\b)|https?://[^\s<>"`]+'
action = "Copy"
binding = { key = "I", mods = "Alt" }


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

# New window in the current shell's directory
[[keyboard.bindings]]
key = "Return"
mods = "Alt"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "V"
mods = "Alt"
action = "ToggleViMode"
